<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/style.css">

</head>
<body>
    <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/glacier.jpg" class="d-block w-100" alt="glacier">
    </div>
    <div class="carousel-item">
      <img src="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/joey-with-toy.jpg" class="d-block w-100" alt="dog with toy">
    </div>
    <div class="carousel-item">
      <img src="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/Joke-Illustration.png" class="d-block w-100" alt="penguin telling a joke">
    </div>
    <div class="carousel-item">
      <img src="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/seattle-ferry.jpg" class="d-block w-100" alt="ferry boat">
    </div>
    <div class="carousel-item">
      <img src="https://shannon-mini-photo-gallery.s3.us-east-1.amazonaws.com/space-needle.jpg" class="d-block w-100" alt="space needle">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
